<!doctype html>
<html lang="en">

    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: var(--font-body); padding: 24px; }
    main { position: relative; text-align: center; max-width: 560px; }
    .bar { position: absolute; left: 50%; top: -40px; width: 120px; height: 260px; margin-left: -60px; background: var(--accent); z-index: -1; }
    h1 { font-family: var(--font-display); font-stretch: 125%; font-weight: 900; font-size: clamp(5rem, 22vw, 11rem); line-height: .85; margin: 0 0 24px; letter-spacing: -.02em; }

    a { display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; border-radius: 999px; background: var(--ink); color: var(--bg); font-family: var(--font-display); font-stretch: 112%; font-weight: 700; text-transform: uppercase; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--focus-halo); outline-offset: 3px; }
  </style>
</head>

  <main>
    <span class="bar" aria-hidden="true"></span>
