    /* Loader (inline, żeby był pierwszą klatką): kopia kryształu w CSS 3D i linia postępu. Zejście: js/loader.js */
    .loader { display: none; }
    .js .loader { display: block; position: fixed; inset: 0; z-index: 1000; }
    .loader__bg { position: absolute; inset: 0; background: var(--bg); }
    .loader__gem { --g: calc(130 * var(--u)); position: absolute; left: 50%; top: 50%; width: var(--g); height: var(--g); margin: calc(var(--g) / -2) 0 0 calc(var(--g) / -2); perspective: calc(var(--g) * 12); }
    .loader__gem::before { content: ""; position: absolute; inset: -60%; background: radial-gradient(closest-side, color-mix(in srgb, var(--light-violet) 22%, transparent), transparent); }
    .loader__spin { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(-.18rad) rotateZ(-.08rad) rotateY(45deg); animation: loader-spin 12s linear infinite; }
    @keyframes loader-spin { to { transform: rotateX(-.18rad) rotateZ(-.08rad) rotateY(405deg); } }
    /* ośmiościan foremny: 4 ściany górne i 4 dolne, podstawa każdej na równiku */
    .loader__spin i { --k: 0; --x: 35.264deg; position: absolute; bottom: 50%; left: calc(50% - var(--g) * .35355); width: calc(var(--g) * .70711); height: calc(var(--g) * .61237); transform-origin: 50% 100%; transform: rotateY(calc(var(--k) * 90deg)) translateZ(calc(var(--g) * .35355)) rotateX(var(--x)); clip-path: polygon(50% 0, 100% 100%, 0 100%);
      background: linear-gradient(color-mix(in srgb, var(--light-ice) 42%, transparent), color-mix(in srgb, var(--light-violet) 30%, transparent) 60%, color-mix(in srgb, var(--light-blue) 24%, transparent)); }
    .loader__spin i:nth-child(4n+2) { --k: 1; } .loader__spin i:nth-child(4n+3) { --k: 2; } .loader__spin i:nth-child(4n+4) { --k: 3; }
    .loader__spin i:nth-child(odd) { background: linear-gradient(color-mix(in srgb, var(--light-ice) 30%, transparent), color-mix(in srgb, var(--light-blue) 30%, transparent) 60%, color-mix(in srgb, var(--light-violet) 26%, transparent)); }
    .loader__spin i:nth-child(n+5) { --x: 144.736deg; background: linear-gradient(color-mix(in srgb, var(--light-amber) 40%, transparent), color-mix(in srgb, var(--light-rose) 24%, transparent) 50%, color-mix(in srgb, var(--light-violet) 30%, transparent)); }
    .loader__spin i::after { content: ""; position: absolute; inset: 0; background: color-mix(in srgb, var(--light-ice) 85%, transparent); clip-path: polygon(evenodd, 50% 0, 100% 100%, 0 100%, 50% 0, 50% 3%, 2.5% 98.5%, 97.5% 98.5%, 50% 3%); }
    .loader__bar { position: absolute; left: 50%; top: calc(50% + var(--g) * .8); width: calc(var(--g) * 1.2); height: 1px; margin-left: calc(var(--g) * -.6); background: color-mix(in srgb, var(--ink) 12%, transparent); overflow: hidden; }
    .loader__bar i { display: block; height: 100%; background: var(--rainbow); transform: scaleX(0); transform-origin: 0 50%; transition: transform .4s ease-out; }

  <script>(() => {
    // Postęp loadera: fonty, glify, obrazy pierwszego ekranu i (strona główna) pierwsza klatka sceny. Min. 0,8 s, maks. 4 s.
    const L = document.currentScript.previousElementSibling, bar = L.querySelector('.loader__bar i'), left = new Set(L.dataset.wait.split(' '));
    let n = left.size, p = 0, ok;
    const all = new Promise((r) => (ok = r)), at = (ms) => new Promise((r) => setTimeout(r, ms - performance.now()));
    const done = (k) => {
      if (!left.delete(k)) return;
      bar.style.transform = `scaleX(${p = Math.max(p, 1 - left.size / n)})`;
      if (!left.size) ok();
    };
    const ready = Promise.race([all, at(4000)]).then(() => at(800));
    window.loader = { done, ready };
    document.fonts.load('700 1em Manrope').then(() => document.fonts.ready).finally(() => done('fonts'));
    addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('main img:not([loading="lazy"])').forEach((img, i) => {
        if (img.complete) return;
        left.add('img' + i); n++;
        for (const ev of ['load', 'error']) img.addEventListener(ev, () => done('img' + i));
      });
      done('dom');
    });
    ready.then(() => setTimeout(() => L.dataset.out || L.remove(), 1500)); // moduł JS się nie wczytał
  })();</script>
